<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>- ɢᴏᴅ | Stats</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030305;
            --card-bg: rgba(15, 15, 22, 0.8);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #fbbf24;
            --accent-glow: rgba(251, 191, 36, 0.25);
            --danger-red: #f43f5e;
            --success-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 50px 20px;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .profile-avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 30px var(--accent-glow);
            animation: divinePulse 3s infinite alternate;
        }

        @keyframes divinePulse {
            0% {
                box-shadow: 0 0 15px rgba(251, 191, 36, 0.2), inset 0 0 10px rgba(251, 191, 36, 0.1);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 35px rgba(251, 191, 36, 0.5), inset 0 0 20px rgba(251, 191, 36, 0.3);
                transform: scale(1.03);
            }
        }

        .profile-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.4);
        }

        .badges-wrapper {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: var(--accent-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Új Unbreakable Community Kártya Design */
        .community-card {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.07) 0%, rgba(15, 15, 22, 0.9) 100%);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 15px;
        }

        .community-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .community-icon {
            font-size: 2rem;
            background: rgba(251, 191, 36, 0.15);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .community-text h3 {
            font-family: 'Cinzel', serif;
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .community-text p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .admin-badge-highlight {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 18px;
            border-radius: 10px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        .interactive-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 24px;
            border-radius: 12px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            border-color: var(--accent-gold);
            color: #fff;
            background: rgba(251, 191, 36, 0.05);
            transform: translateY(-2px);
        }

        .action-btn.active {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #030305;
            font-weight: 700;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .content-panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: all 0.4s ease;
        }

        .content-panel h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .content-panel p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .stats-image-container {
            margin-top: 30px;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(251, 191, 36, 0.3);
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.15);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            background: rgba(0, 0, 0, 0.4);
        }

        .stats-image-container:hover {
            transform: scale(1.01);
            border-color: var(--accent-gold);
            box-shadow: 0 0 35px rgba(251, 191, 36, 0.35);
        }

        .stats-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <header>
            <div class="profile-avatar-container">
                <img src="9ace024fb018e76b5213645e1ba38c8bbfecce0c_full.jpg" alt="- ɢᴏᴅ Avatar">
            </div>
            <div>
                <h1>- ɢᴏᴅ</h1>
                <div class="badges-wrapper" style="margin-top: 15px;">
                    <div class="badge">⚡ Divine Status</div>
                    <div class="badge">🏆 Elite Tier</div>
                </div>
            </div>
        </header>

        <!-- Unbreakable Community Kiemelt Doboz -->
        <div class="community-card">
            <div class="community-info">
                <div class="community-icon">🛡️</div>
                <div class="community-text">
                    <h3>Unbreakable Community</h3>
                    <p>CS2 Public Server Network</p>
                </div>
            </div>
            <div class="admin-badge-highlight">
                👑 Admin Controller
            </div>
        </div>

        <div class="interactive-bar">
            <button class="action-btn active" onclick="switchTab('primary')">⚡ Primary Stats</button>
            <button class="action-btn" onclick="switchTab('settings')">⚙️ Settings</button>
        </div>

        <div class="content-panel" id="main-panel">
            <h2 id="panel-title">Primary Statistics</h2>
            <p id="panel-desc">Official performance overview and match metrics.</p>
            
            <div id="panel-content">
                <div class="stats-image-container">
                    <img src="godstats.png" alt="- ɢᴏᴅ Primary Statistics">
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2 + 0.5,
                speedY: Math.random() * 0.4 + 0.1,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) p.y = height;

                ctx.fillStyle = `rgba(251, 191, 36, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();

        function switchTab(tab) {
            const buttons = document.querySelectorAll('.action-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const title = document.getElementById('panel-title');
            const desc = document.getElementById('panel-desc');
            const content = document.getElementById('panel-content');

            if (tab === 'primary') {
                title.textContent = "Primary Statistics";
                desc.textContent = "Official performance overview and match metrics.";
                content.innerHTML = `
                    <div class="stats-image-container">
                        <img src="godstats.png" alt="- ɢᴏᴅ Primary Statistics">
                    </div>
                `;
            } else if (tab === 'settings') {
                title.textContent = "Player Settings";
                desc.textContent = "Configuration details including sensitivity, resolution, and crosshair.";
                content.innerHTML = `
                    <div style="margin-top: 30px; border: 2px dashed rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 60px 20px; color: var(--text-muted); font-style: italic; background: rgba(0, 0, 0, 0.2);">
                        [ Ide jönnek majd a játékos settingsjei: érzékenység, felbontás, crosshair ]
                    </div>
                `;
            }
        }
    </script>

</body>
</html>
