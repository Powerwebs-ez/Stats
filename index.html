<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>- ɢᴏᴅ | Stats</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #0b0b10;
            --text-color: #f1f5f9;
            --text-muted: #64748b;
            --accent-gold: #eab308;
            --accent-glow: rgba(234, 179, 8, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 60px 20px;
            transition: background-color 0.2s ease;
        }

        /* Basszus Rezonáló Effekt */
        body.bass-hit {
            animation: subBassShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes subBassShake {
            0% { transform: translate(0, 0) scale(1); filter: brightness(1); }
            20% { transform: translate(-5px, 4px) scale(1.006); filter: brightness(1.25); }
            40% { transform: translate(5px, -4px) scale(1.01); filter: brightness(1.3); }
            60% { transform: translate(-3px, -3px) scale(1.005); filter: brightness(1.15); }
            80% { transform: translate(2px, 2px) scale(1.002); filter: brightness(1.05); }
            100% { transform: translate(0, 0) scale(1); filter: brightness(1); }
        }

        body.bass-hit #ambient-glow {
            opacity: 0.8;
        }

        #ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(circle at 50% 20%, rgba(234, 179, 8, 0.04), transparent 60%);
            z-index: 1;
            transition: opacity 0.3s ease;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .profile-avatar-container {
            width: 110px;
            height: 110px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--accent-gold);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .profile-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
        }

        .badges-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(234, 179, 8, 0.05);
            border: 1px solid rgba(234, 179, 8, 0.2);
            color: var(--accent-gold);
            padding: 4px 14px;
            border-radius: 6px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .community-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 18px 24px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .community-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .community-icon {
            font-size: 1.5rem;
            background: rgba(234, 179, 8, 0.08);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid rgba(234, 179, 8, 0.2);
        }

        .community-text h3 {
            font-family: 'Cinzel', serif;
            color: #fff;
            font-size: 1rem;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .community-text p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .admin-badge-highlight {
            background: rgba(234, 179, 8, 0.08);
            border: 1px solid rgba(234, 179, 8, 0.3);
            color: var(--accent-gold);
            padding: 6px 14px;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .transparent-player {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: border-color 0.3s ease;
        }

        .transparent-player.playing {
            border-color: rgba(234, 179, 8, 0.3);
        }

        .eq-visualizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 14px;
            width: 18px;
        }

        .eq-bar {
            width: 2px;
            background: var(--text-muted);
            border-radius: 1px;
            height: 4px;
            transition: height 0.2s ease;
        }

        .transparent-player.playing .eq-bar {
            background: var(--accent-gold);
            animation: eqDance 0.8s infinite alternate ease-in-out;
        }

        .transparent-player.playing .eq-bar:nth-child(1) { animation-delay: 0.1s; }
        .transparent-player.playing .eq-bar:nth-child(2) { animation-delay: 0.4s; }
        .transparent-player.playing .eq-bar:nth-child(3) { animation-delay: 0.2s; }
        .transparent-player.playing .eq-bar:nth-child(4) { animation-delay: 0.5s; }

        @keyframes eqDance {
            0% { height: 4px; }
            100% { height: 14px; }
        }

        .time-display {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 35px;
        }

        .progress-container {
            flex-grow: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-gold);
            width: 0%;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .control-icon-btn:hover {
            color: var(--accent-gold);
        }

        .control-icon-btn.main-play {
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        .interactive-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .action-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            border-color: rgba(234, 179, 8, 0.4);
            color: #fff;
        }

        .action-btn.active {
            background: rgba(234, 179, 8, 0.08);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            font-weight: 700;
        }

        .content-panel {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }

        .content-panel h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .content-panel p {
            color: var(--text-muted);
            font-size: 0.85rem;
            max-width: 450px;
            margin: 0 auto;
        }

        .stats-image-container {
            margin-top: 25px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #000;
        }

        .stats-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div id="ambient-glow"></div>
    <canvas id="bg-canvas"></canvas>

    <audio id="bg-music" src="zene.mp3" loop autoplay></audio>

    <div class="container">
        <header>
            <div class="profile-avatar-container">
                <img src="9ace024fb018e76b5213645e1ba38c8bbfecce0c_full.jpg" alt="- ɢᴏᴅ Avatar">
            </div>
            <div>
                <h1>- ɢᴏᴅ</h1>
                <div class="badges-wrapper" style="margin-top: 12px;">
                    <div class="badge">⚡ Divine Status</div>
                    <div class="badge">🏆 Elite Tier</div>
                </div>
            </div>
        </header>

        <div class="community-card">
            <div class="community-info">
                <div class="community-icon">🛡️</div>
                <div class="community-text">
                    <h3>Unbreakable Community</h3>
                    <p>CS2 Public Server Network</p>
                </div>
            </div>
            <div class="admin-badge-highlight">
                👑 Admin Controller
            </div>
        </div>

        <div class="transparent-player" id="player-bar">
            <div class="eq-visualizer">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
            </div>
            <div class="time-display" id="current-time">0:00</div>
            <div class="progress-container" id="progress-container" onclick="seekAudio(event)">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="time-display" id="duration-time">0:00</div>
            <div class="player-controls">
                <button class="control-icon-btn" onclick="skipTime(-10)" title="10mp Vissza">⏮</button>
                <button class="control-icon-btn main-play" id="play-pause-btn" onclick="togglePlay()" title="Lejátszás / Szünet">⏸</button>
                <button class="control-icon-btn" onclick="skipTime(10)" title="10mp Előre">⏭</button>
            </div>
        </div>

        <div class="interactive-bar">
            <button class="action-btn active" onclick="switchTab('primary')">⚡ Primary Stats</button>
            <button class="action-btn" onclick="switchTab('settings')">⚙️ Settings</button>
        </div>

        <div class="content-panel" id="main-panel">
            <h2 id="panel-title">Primary Statistics</h2>
            <p id="panel-desc">Official performance overview and match metrics.</p>
            
            <div id="panel-content">
                <div class="stats-image-container">
                    <img src="godstats.png" alt="- ɢᴏᴅ Primary Statistics">
                </div>
            </div>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const playerBar = document.getElementById('player-bar');

        let bassTriggered = false;

        window.addEventListener('DOMContentLoaded', () => {
            music.volume = 0.5;
            music.play().then(() => {
                playerBar.classList.add('playing');
                playPauseBtn.textContent = "⏸";
            }).catch(error => {
                playPauseBtn.textContent = "▶";
                playerBar.classList.remove('playing');
                document.body.addEventListener('click', () => {
                    if (music.paused) {
                        music.play();
                        playerBar.classList.add('playing');
                        playPauseBtn.textContent = "⏸";
                    }
                }, { once: true });
            });
        });

        function togglePlay() {
            if (music.paused) {
                music.play();
                playPauseBtn.textContent = "⏸";
                playerBar.classList.add('playing');
            } else {
                music.pause();
                playPauseBtn.textContent = "▶";
                playerBar.classList.remove('playing');
            }
        }

        music.addEventListener('timeupdate', () => {
            if (!isNaN(music.duration)) {
                const progressPercent = (music.currentTime / music.duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
                currentTimeEl.textContent = formatTime(music.currentTime);
                durationTimeEl.textContent = formatTime(music.duration);

                if (music.currentTime >= 12.0 && music.currentTime < 12.3 && !bassTriggered) {
                    triggerBassEffect();
                    bassTriggered = true;
                }

                if (music.currentTime < 11.5) {
                    bassTriggered = false;
                }
            }
        });

        function triggerBassEffect() {
            document.body.classList.add('bass-hit');
            setTimeout(() => {
                document.body.classList.remove('bass-hit');
            }, 400);
        }

        function seekAudio(e) {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = music.duration;
            if (!isNaN(duration)) {
                music.currentTime = (clickX / width) * duration;
            }
        }

        function skipTime(seconds) {
            music.currentTime = Math.min(Math.max(music.currentTime + seconds, 0), music.duration);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5 + 0.5,
                speedY: Math.random() * 0.3 + 0.1,
                alpha: Math.random() * 0.4 + 0.1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) p.y = height;

                ctx.fillStyle = `rgba(234, 179, 8, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();

        function switchTab(tab) {
            const buttons = document.querySelectorAll('.action-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const title = document.getElementById('panel-title');
            const desc = document.getElementById('panel-desc');
            const content = document.getElementById('panel-content');

            if (tab === 'primary') {
                title.textContent = "Primary Statistics";
                desc.textContent = "Official performance overview and match metrics.";
                content.innerHTML = `
                    <div class="stats-image-container">
                        <img src="godstats.png" alt="- ɢᴏᴅ Primary Statistics">
                    </div>
                `;
            } else if (tab === 'settings') {
                title.textContent = "Player Settings";
                desc.textContent = "Configuration details including sensitivity, resolution, and crosshair.";
                content.innerHTML = `
                    <div style="margin-top: 25px; border: 1px dashed rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 50px 20px; color: var(--text-muted); font-size: 0.85rem; background: rgba(0, 0, 0, 0.2);">
                        [ Ide jönnek majd a játékos settingsjei: érzékenység, felbontás, crosshair ]
                    </div>
                `;
            }
        }
    </script>

</body>
</html>
