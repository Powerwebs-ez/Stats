<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>- ɢᴏᴅ | Stats</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030305;
            --card-bg: rgba(15, 15, 22, 0.8);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #fbbf24;
            --accent-glow: rgba(251, 191, 36, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 50px 20px;
        }

        /* Basszus Rezonáló / Megremegő Effekt Klaszter */
        body.bass-hit {
            animation: subBassShake 0.4s ease;
        }

        @keyframes subBassShake {
            0% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(-2px, 2px) scale(1.002); }
            40% { transform: translate(2px, -1px) scale(1.003); }
            60% { transform: translate(-1px, -2px) scale(1.002); }
            80% { transform: translate(1px, 1px) scale(1.001); }
            100% { transform: translate(0, 0) scale(1); }
        }

        #spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(251, 191, 36, 0.06), transparent 40%);
            z-index: 1;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .profile-avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 30px var(--accent-glow);
            animation: divinePulse 3s infinite alternate;
        }

        @keyframes divinePulse {
            0% {
                box-shadow: 0 0 15px rgba(251, 191, 36, 0.2), inset 0 0 10px rgba(251, 191, 36, 0.1);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 35px rgba(251, 191, 36, 0.5), inset 0 0 20px rgba(251, 191, 36, 0.3);
                transform: scale(1.03);
            }
        }

        .profile-avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 25px rgba(251, 191, 36, 0.4);
        }

        .badges-wrapper {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: var(--accent-gold);
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .tilt-card {
            transform-style: preserve-3d;
            transition: transform 0.1s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .community-card {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.07) 0%, rgba(15, 15, 22, 0.9) 100%);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 15px;
        }

        .community-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .community-icon {
            font-size: 2rem;
            background: rgba(251, 191, 36, 0.15);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .community-text h3 {
            font-family: 'Cinzel', serif;
            color: #fff;
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .community-text p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .admin-badge-highlight {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 18px;
            border-radius: 10px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        .transparent-player {
            background: rgba(10, 10, 15, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 24px;
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.4s ease;
        }

        .transparent-player.playing {
            border-color: rgba(251, 191, 36, 0.3);
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.15);
        }

        .eq-visualizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
            width: 20px;
        }

        .eq-bar {
            width: 3px;
            background: var(--text-muted);
            border-radius: 2px;
            height: 4px;
            transition: height 0.2s ease;
        }

        .transparent-player.playing .eq-bar {
            background: var(--accent-gold);
            animation: eqDance 0.8s infinite alternate ease-in-out;
        }

        .transparent-player.playing .eq-bar:nth-child(1) { animation-delay: 0.1s; }
        .transparent-player.playing .eq-bar:nth-child(2) { animation-delay: 0.4s; }
        .transparent-player.playing .eq-bar:nth-child(3) { animation-delay: 0.2s; }
        .transparent-player.playing .eq-bar:nth-child(4) { animation-delay: 0.5s; }

        @keyframes eqDance {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        .time-display {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            min-width: 40px;
        }

        .progress-container {
            flex-grow: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-gold);
            width: 0%;
            border-radius: 2px;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .control-icon-btn:hover {
            color: var(--accent-gold);
            transform: scale(1.1);
        }

        .control-icon-btn.main-play {
            color: var(--accent-gold);
            font-size: 1.2rem;
        }

        .interactive-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 10px 24px;
            border-radius: 12px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            border-color: var(--accent-gold);
            color: #fff;
            background: rgba(251, 191, 36, 0.05);
            transform: translateY(-2px);
        }

        .action-btn.active {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #030305;
            font-weight: 700;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .content-panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: all 0.4s ease;
        }

        .content-panel h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .content-panel p {
            color: var(--text-muted);
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .stats-image-container {
            margin-top: 30px;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(251, 191, 36, 0.3);
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.15);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: rgba(0, 0, 0, 0.4);
        }

        .stats-image-container:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 0 35px rgba(251, 191, 36, 0.35);
        }

        .stats-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div id="spotlight"></div>
    <canvas id="bg-canvas"></canvas>

    <audio id="bg-music" src="zene.mp3" loop autoplay></audio>

    <div class="container">
        <header>
            <div class="profile-avatar-container">
                <img src="9ace024fb018e76b5213645e1ba38c8bbfecce0c_full.jpg" alt="- ɢᴏᴅ Avatar">
            </div>
            <div>
                <h1>- ɢᴏᴅ</h1>
                <div class="badges-wrapper" style="margin-top: 15px;">
                    <div class="badge">⚡ Divine Status</div>
                    <div class="badge">🏆 Elite Tier</div>
                </div>
            </div>
        </header>

        <div class="community-card tilt-card" data-tilt>
            <div class="community-info">
                <div class="community-icon">🛡️</div>
                <div class="community-text">
                    <h3>Unbreakable Community</h3>
                    <p>CS2 Public Server Network</p>
                </div>
            </div>
            <div class="admin-badge-highlight">
                👑 Admin Controller
            </div>
        </div>

        <div class="transparent-player tilt-card" id="player-bar" data-tilt>
            <div class="eq-visualizer">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
            </div>
            <div class="time-display" id="current-time">0:00</div>
            <div class="progress-container" id="progress-container" onclick="seekAudio(event)">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="time-display" id="duration-time">0:00</div>
            <div class="player-controls">
                <button class="control-icon-btn" onclick="skipTime(-10)" title="10mp Vissza">⏮</button>
                <button class="control-icon-btn main-play" id="play-pause-btn" onclick="togglePlay()" title="Lejátszás / Szünet">⏸</button>
                <button class="control-icon-btn" onclick="skipTime(10)" title="10mp Előre">⏭</button>
            </div>
        </div>

        <div class="interactive-bar">
            <button class="action-btn active" onclick="switchTab('primary')">⚡ Primary Stats</button>
            <button class="action-btn" onclick="switchTab('settings')">⚙️ Settings</button>
        </div>

        <div class="content-panel tilt-card" id="main-panel" data-tilt>
            <h2 id="panel-title">Primary Statistics</h2>
            <p id="panel-desc">Official performance overview and match metrics.</p>
            
            <div id="panel-content">
                <div class="stats-image-container">
                    <img src="godstats.png" alt="- ɢᴏᴅ Primary Statistics">
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            document.documentElement.style.setProperty('--mouse-x', `${x}px`);
            document.documentElement.style.setProperty('--mouse-y', `${y}px`);
        });

        const tiltCards = document.querySelectorAll('[data-tilt]');
        tiltCards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -5;
                const rotateY = ((x - centerX) / centerX) * 5;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            });
        });

        const music = document.getElementById('bg-music');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const playerBar = document.getElementById('player-bar');

        let bassTriggered = false;

        window.addEventListener('DOMContentLoaded', () => {
            music.volume = 0.5;
            music.play().then(() => {
                playerBar.classList.add('playing');
                playPauseBtn.textContent = "⏸";
            }).catch(error => {
                playPauseBtn.textContent = "▶";
                playerBar.classList.remove('playing');
                document.body.addEventListener('click', () => {
                    if (music.paused) {
                        music.play();
                        playerBar.classList.add('playing');
                        playPauseBtn.textContent = "⏸";
                    }
                }, { once: true });
            });
        });

        function togglePlay() {
            if (music.paused) {
                music.play();
                playPauseBtn.textContent = "⏸";
                playerBar.classList.add('playing');
            } else {
                music.pause();
                playPauseBtn.textContent = "▶";
                playerBar.classList.remove('playing');
            }
        }

        music.addEventListener('timeupdate', () => {
            if (!isNaN(music.duration)) {
                const progressPercent = (music.currentTime / music.duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
                currentTimeEl.textContent = formatTime(music.currentTime);
                durationTimeEl.textContent = formatTime(music.duration);

                // 12. másodpercnél a basszus effekt lengetése
                if (music.currentTime >= 12.0 && music.currentTime < 12.3 && !bassTriggered) {
                    triggerBassEffect();
                    bassTriggered = true;
                }

                // Ha visszatekerik a zenét 12 másodperc elé, engedje újra aktiválni
                if (music.currentTime < 11.5) {
                    bassTriggered = false;
                }
            }
        });

        // Basszus rezonáló effekt meghívása
        function triggerBassEffect() {
            document.body.classList.add('bass-hit');
            setTimeout(() => {
                document.body.classList.remove('bass-hit');
            }, 400);
        }

        function seekAudio(e) {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = music.duration;
            if (!isNaN(duration)) {
                music.currentTime = (clickX / width) * duration;
            }
        }

        function skipTime(seconds) {
            music.currentTime = Math.min(Math.max(music.currentTime + seconds, 0), music.duration);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2 + 0.5,
                speedY: Math.random() * 0.4 + 0.1,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.y -= p.speedY;
                if (p.y < 0) p.y = height;

                ctx.fillStyle = `rgba(251, 191, 36, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();

        function switchTab(tab) {
            const buttons = document.querySelectorAll('.action-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const title = document.getElementById('panel-title');
            const desc = document.getElementById('panel-desc');
            const content = document.getElementById('panel-content');

            if (tab === 'primary') {
                title.textContent = "Primary Statistics";
                desc.textContent = "Official performance overview and match metrics.";
                content.innerHTML = `
                    <div class="stats-image-container">
                        <img src="godstats.png" alt="- ɢᴏᴅ Primary Statistics">
                    </div>
                `;
            } else if (tab === 'settings') {
                title.textContent = "Player Settings";
                desc.textContent = "Configuration details including sensitivity, resolution, and crosshair.";
                content.innerHTML = `
                    <div style="margin-top: 30px; border: 2px dashed rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 60px 20px; color: var(--text-muted); font-style: italic; background: rgba(0, 0, 0, 0.2);">
                        [ Ide jönnek majd a játékos settingsjei: érzékenység, felbontás, crosshair ]
                    </div>
                `;
            }
        }
    </script>

</body>
</html>
