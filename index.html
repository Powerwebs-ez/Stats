<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerrr666yyy Stats</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050508;
            --card-bg: rgba(20, 20, 35, 0.7);
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --prime-gold: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }

        /* Követő egér fénycsóva (Cursor Glow) */
        #cursor-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.18) 0%, rgba(236, 72, 153, 0.08) 40%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            transition: width 0.3s, height 0.3s;
        }

        /* Háttér interaktív fényfoltok */
        .bg-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.12), rgba(236, 72, 153, 0.12));
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.5), 0 0 40px rgba(6, 182, 212, 0.2);
            margin-bottom: 20px;
        }

        /* Villogó / Pulzáló Prime Badge */
        .prime-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(251, 191, 36, 0.1);
            border: 2px solid var(--prime-gold);
            color: var(--prime-gold);
            padding: 8px 22px;
            border-radius: 30px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulseGlow 1.8s infinite alternate;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 5px rgba(251, 191, 36, 0.2), inset 0 0 5px rgba(251, 191, 36, 0.1);
                border-color: rgba(251, 191, 36, 0.6);
            }
            100% {
                box-shadow: 0 0 25px rgba(251, 191, 36, 0.8), inset 0 0 15px rgba(251, 191, 36, 0.4);
                border-color: #fff;
                transform: scale(1.03);
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        /* Üveghatású kártyák */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent-cyan);
            box-shadow: 0 15px 30px rgba(6, 182, 212, 0.25);
        }

        .card h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .card .value {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .main-content {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .main-content h2 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            color: var(--accent-cyan);
        }

        .main-content p {
            color: var(--text-muted);
            line-height: 1.7;
        }
    </style>
</head>
<body>

    <!-- Egér fénycsóva elem -->
    <div id="cursor-glow"></div>

    <!-- Háttér interaktív fényfolt -->
    <div class="bg-glow" id="bgGlow"></div>

    <div class="container">
        <header>
            <h1>Powerrr666yyy Stats</h1>
            <div class="prime-badge">
                ⭐ Prime Időszak Statisztikák
            </div>
        </header>

        <div class="stats-grid">
            <div class="card">
                <h3>Első Stat</h3>
                <div class="value">124</div>
            </div>
            <div class="card">
                <h3>Második Stat</h3>
                <div class="value">85%</div>
            </div>
            <div class="card">
                <h3>Harmadik Stat</h3>
                <div class="value">12 nap</div>
            </div>
        </div>

        <div class="main-content">
            <h2>Részletes áttekintés</h2>
            <p>Itt találhatók a prime korszakom legfontosabb mutatói és teljesítményadatai. Most már az egérmutatót is egy interaktív neon fénycsóva kíséri!</p>
        </div>
    </div>

    <script>
        // Egérkövető és fénycsóva szkript
        const cursorGlow = document.getElementById('cursor-glow');
        const bgGlow = document.getElementById('bgGlow');

        window.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            // A kurzor fénycsóva pontos mozgatása
            cursorGlow.style.left = `${x}px`;
            cursorGlow.style.top = `${y}px`;

            // A háttérfény finom, kicsit lomhább követése a mélységérzetért
            const bgX = (x / window.innerWidth) * 100;
            const bgY = (y / window.innerHeight) * 100;
            bgGlow.style.transform = `translate(${bgX - 50}vw, ${bgY - 50}vh)`;
        });
    </script>

</body>
</html>
